<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Вычисление суммы</title>
<style>
form {
   width : 197px;
}
p,hr {
   margin: 3px 0;
}
</style>
</head>
<body>
<form>
<fieldset>
<legend>Вычисление суммы</legend>
<p>Диапазон через пробел
<input id="tp1" type="text" size="17"></p><hr>
<p>Сумма нечетных чисел
<input id="tp2" type="text" size="17"></p>
<button type="button" id="bb">Вычислить</button>
<button type="reset">Сбросить</button>
</fieldset>
</form>
<script>
function func() {
let str = tp1.value;
let mas = str.split(" ");
let a = +mas[0];
let b = +mas[1];
let rez = 0;
for (let i = a; i <= b; i++) {
  if (i % 2 != 0) {
    rez = rez + i;
  }
}
tp2.value = rez;
}
bb.addEventListener("click", func);
</script>
</body>
</html>
