<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Коллекция объектов</title>
<style>
#dd  {
    margin: 100px;
    position: relative;
}
img {
    position: absolute;
}
#d1 {
    position: absolute;
    width: 300px;
    height: 300px;
    background: white;
    display: grid;
    place-items: center;
    font-size: 30px;
    border: 2px solid black;
}
</style>
</head>
<body>
<div id="dd">
<img src="ris9/ris1.jpg">
<div id="d1">Буславский</div>
<img src="ris9/ris2.jpg">
<img src="ris9/ris3.jpg">
</div>

<script>
let mas = [1,2,3,4];

function func() {
for (let i=0; i<4; i++)
[... dd.children][i].style.zIndex=mas[i];
}
document.addEventListener("load", func);

function pop() {
mas.unshift(mas.pop());
func();
}
dd.addEventListener("click", pop);
</script>
</body>
</html>
