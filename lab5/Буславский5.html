<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Значения функции</title>
<style>
form {
   width : 181px;
}
p,hr {
   margin: 3px 0;
}
</style>
</head>
<body>
<form>
<fieldset>
<legend>Значения функции</legend>
<p>Задайте аргумент: диапазон значений через пробел
<input id="tp1" type="text" size="15"></p>
<p>шаг изменения
<input id="tp2" type="text" size="15"></p><hr>
<button type="button" id="bb">Вывести</button>
<button type="reset" id="rr">Сбросить</button>
</fieldset>
</form>
<script>
let out = document.createElement('pre');
function func() {
let str = tp1.value;
let mas = str.split(" ");
let min = +mas[0];
let max = +mas[1];
let h = +tp2.value;
let Amas = {};
for (let x=min; x<max+h; x=x+h) {
  let str1 = x.toFixed(2);
  let str2 = (Math.abs(x-1)+Math.sin(x)).toFixed(3);
  Amas[str1] = str2;
}
let z1="Таблица значений функции<br>";
let z2="     x        f(x)<br>";
let tab = "";
for (let key in Amas) {
   tab += "    " + key + "      " + Amas[key] + "<br>";
}
out.innerHTML = z1 + z2 + tab;
document.body.appendChild(out);
Amas = {};
}
function func2() {
document.body.removeChild(out);
}
bb.addEventListener("click", func);
rr.addEventListener("click", func2);
</script>
</body>
</html>
