<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Изменение цвета фона</title>
<style>
div  {
  width: 150px;
  height: 150px;
  margin: 100px;
  background-color: red;
}
</style>
</head>
<body>
<div id="dd"></div>

<script>
let mas=["red","blue","green"];
let n = 0;
let len = mas.length;

function func() {
if (n>=len-1) n=0;
else n++;
dd.style.backgroundColor = mas[n];
}
dd.addEventListener("click", func);
</script>
</body>
</html>
