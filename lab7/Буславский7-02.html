<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Тест по педагогике и психологии</title>
<style>
form {
    width: 700px;
    margin-left: 100px;
    margin-top: 50px;
    font-size: 16pt;
}
fieldset {
    background-color: lightgreen;
}
p,hr {
   margin: 3px 0;
}
#form2, #form3 {
    display: none;
}
</style>
</head>
<body>
<form id="form1">
<fieldset>
<p id="pp1">Тест по педагогике и психологии</p><hr>
<button type="button" id="bb1">Старт</button>
</fieldset>
</form>
<form id="form2">
<fieldset>
<p id="pp2"> </p><hr>
<p><input type="checkbox" name="test" value=1 id="v1">
<label id="r1" for="v1"> </label></p>
<p><input type="checkbox" name="test" value=2 id="v2">
<label id="r2" for="v2"> </label></p>
<p><input type="checkbox" name="test" value=3 id="v3">
<label id="r3" for="v3"> </label></p>
<p><input type="checkbox" name="test" value=4 id="v4">
<label id="r4" for="v4"> </label></p>
<button type="button" id="bb2">Дальше</button>
</fieldset>
</form>
<form id="form3">
<fieldset>
<p id="pp3">Результат тестирования</p><hr>
<button type="button" id="bb3">Завершить</button>
</fieldset>
</form>
<script>
let nn = 10;   // число заданий
let ii = 1;   // текущий номер задания
let mas = []; // для заданий и вариантов ответов
let rez = 0;  // число правильных ответов
mas[1] = ["Задание 1<br>Дополните предложение. Изучением индивидуальных различий между людьми занимается ... психология.",
"интегральная",
"интегративная",
"личности",
"дифференциальная",
"4"
];
mas[2] = ["Задание 2<br>Дополните предложение. Изучение психики посредством общения называется ...",
"методом беседы",
"тестированием",
"наблюдением",
"анкетированием",
"1"
];
mas[3] = ["Задание 3<br>Дополните предложение. Психология становится самостоятельной и экспериментальной областью научного знания ...",
"в XIX в.",
"в XX в.",
"в XVIII в.",
"в XVI в.",
"1"
];
mas[4] = ["Задание 4<br>Дополните предложение. Основы рефлекторной теории психики заложили работы ...",
"Р.Декарта, И.М. Сеченова",
"Л.С. Выготского, С.Л. Рубинштейна",
"Аристотеля, Гиппократа, Платона",
"З.Фрейда, А.Маслоу¸ К.Юнга",
"1"
];
mas[5] = ["Задание 5<br>Дополните предложение. Психологическое направление, которое считает, что предмет психологии – это поведение как совокупность реакций организма на стимулы внешней среды, – это ...",
"психоанализ",
"гуманистическая психология",
"психология сознания",
"бихевиоризм",
"4"
];
mas[6] = ["Задание 6<br>Дополните предложение. Психологическая система анализа душевной жизни, предложенная З.Фрейдом, это ...",
"гуманистическая психология",
"глубинная психология (психоанализ)",
"ассоциативная психология",
"когнитивная психология",
"2"
];
mas[7] = ["Задание 7<br>Дополните предложение. Отечественный психолог Л.С.Выготский является автором ...",
"стратометрической концепции",
"культурно-исторической концепции психического развития",
"деятельностной концепции",
"концепции поэтапного формирования умственных действий",
"2"
];
mas[8] = ["Задание 8<br>Дополните предложение. Психологией деятельности активно занимался ...",
"Э.Кречмер",
"З.Фрейд",
"В.М. Бехтерев",
"А.Н. Леонтьев",
"4"
];
mas[9] = ["Задание 9<br>Дополните предложение. Одним из основателей советской психологии является ...",
"Р.С. Немов",
"Л.С. Выготский",
"А.В. Петровский",
"И.М. Сеченов",
"2"
];
mas[10] = ["Задание 10<br>Дополните предложение. В.Вунд является первым, кто создал ...",
"психокоррекционный центр",
"концепцию бессознательного",
"психологическую лабораторию",
"теорию рефлекса",
"3"
];
function start() {
form1.style.display="none";
form2.style.display="block";
pp2.innerHTML=mas[ii][0];
r1.innerHTML=mas[ii][1];
r2.innerHTML=mas[ii][2];
r3.innerHTML=mas[ii][3];
r4.innerHTML=mas[ii][4];
}
function call() {
let kod="";
for (let elem of form2.test) {
  if (elem.checked) {
    kod=kod+elem.value;
    elem.checked=false;
  }
}
if (kod == "") return;
if (mas[ii][5] == kod) rez++;
ii++;
if (ii<=nn)  {
pp2.innerHTML=mas[ii][0];
r1.innerHTML=mas[ii][1];
r2.innerHTML=mas[ii][2];
r3.innerHTML=mas[ii][3];
r4.innerHTML=mas[ii][4];
}
else {
form2.style.display="none";
form3.style.display="block";
pp3.innerHTML="Результат тестирования:<br>выполненных заданий " + rez + " из " + nn;
ii=1;
rez=0;
}
}
function over() {
form3.style.display="none";
form1.style.display="block";
}
bb1.addEventListener("click", start);
bb2.addEventListener("click", call);
bb3.addEventListener("click", over);
</script>
</body>
</html>
