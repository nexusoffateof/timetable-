<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Вычисление объема параллелепипеда</title>
<style>

</style>
<script>
let a = +prompt("Введите длину параллелепипеда");
let b = +prompt("Введите ширину параллелепипеда");
let c = +prompt("Введите высоту параллелепипеда");
let v = a * b * c;
document.write("<p>Вычисление объема параллелепипеда</p>");
document.write("Длина: ", a, " см<br>");
document.write("Ширина: ", b, " см<br>");
document.write("Высота: ", c, " см<br>");
document.write("Объем: ", v.toFixed(2), " куб.см<br>");
</script>
</head>
<body>
</body>
</html>
