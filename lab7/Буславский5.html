<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Шаблон теста с одиночным выбором</title>
<style>
form {
    width: 450px;
    margin-left: 100px;
    margin-top: 50px;
    font-size: 16pt;
}
fieldset {
    background-color: lightgreen;
}
p,hr {
   margin: 3px 0;
}
#form2, #form3 {
    display: none;
}
</style>
</head>
<body>
<form id="form1">
<fieldset>
<p id="pp1">Шаблон теста с одиночным выбором</p><hr>
<button type="button" id="bb1">Старт</button>
</fieldset>
</form>
<form id="form2">
<fieldset>
<p id="pp2"> </p><hr>
<p><input type="radio" name="test" value=1 id="v1">
<label id="r1" for="v1"> </label></p>
<p><input type="radio" name="test" value=2 id="v2">
<label id="r2" for="v2"> </label></p>
<p><input type="radio" name="test" value=3 id="v3">
<label id="r3" for="v3"> </label></p>
<p><input type="radio" name="test" value=4 id="v4">
<label id="r4" for="v4"> </label></p>
<button type="button" id="bb2">Дальше</button>
</fieldset>
</form>
<form id="form3">
<fieldset>
<p id="pp3">Результат тестирования</p><hr>
<button type="button" id="bb3">Завершить</button>
</fieldset>
</form>
<script>
let nn = 5;   // число заданий
let ii = 1;   // текущий номер задания
let mas = []; // для заданий и вариантов ответов
let rez = 0;  // число правильных ответов
mas[1] = ["Задание 1<br>Формулировка задания",
"Вариант 1 ответа на задание 1",
"Вариант 2 ответа на задание 1",
"Вариант 3 ответа на задание 1",
"Вариант 4 ответа на задание 1",
3
];
mas[2] = ["Задание 2<br>Формулировка задания",
"Вариант 1 ответа на задание 2",
"Вариант 2 ответа на задание 2",
"Вариант 3 ответа на задание 2",
"Вариант 4 ответа на задание 2",
1
];
mas[3] = ["Задание 3<br>Формулировка задания",
"Вариант 1 ответа на задание 3",
"Вариант 2 ответа на задание 3",
"Вариант 3 ответа на задание 3",
"Вариант 4 ответа на задание 3",
4
];
mas[4] = ["Задание 4<br>Формулировка задания",
"Вариант 1 ответа на задание 4",
"Вариант 2 ответа на задание 4",
"Вариант 3 ответа на задание 4",
"Вариант 4 ответа на задание 4",
2
];
mas[5] = ["Задание 5<br>Формулировка задания",
"Вариант 1 ответа на задание 5",
"Вариант 2 ответа на задание 5",
"Вариант 3 ответа на задание 5",
"Вариант 4 ответа на задание 5",
3
];
function start() {
form1.style.display="none";
form2.style.display="block";
pp2.innerHTML=mas[ii][0];
r1.innerHTML=mas[ii][1];
r2.innerHTML=mas[ii][2];
r3.innerHTML=mas[ii][3];
r4.innerHTML=mas[ii][4];
}
function call() {
if (form2.test.value == "") return;
let kod = +form2.test.value;
form2.test[kod-1].checked = false;
if (mas[ii][5] == kod) rez++;
ii++;
if (ii<=nn)  {
pp2.innerHTML=mas[ii][0];
r1.innerHTML=mas[ii][1];
r2.innerHTML=mas[ii][2];
r3.innerHTML=mas[ii][3];
r4.innerHTML=mas[ii][4];
}
else {
form2.style.display="none";
form3.style.display="block";
pp3.innerHTML="Результат тестирования:<br>выполненных заданий " + rez + " из " + nn;
ii=1;
rez=0;
}
}
function over() {
form3.style.display="none";
form1.style.display="block";
}
bb1.addEventListener("click", start);
bb2.addEventListener("click", call);
bb3.addEventListener("click", over);
</script>
</body>
</html>
