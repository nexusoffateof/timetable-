<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Вычисление площади треугольника</title>
<style>

</style>
<script>
let a = +prompt("Введите длину первого катета");
let b = +prompt("Введите длину второго катета");
let s = a * b / 2;
document.write("<p>Вычисление площади треугольника</p>");
document.write("Длина первого катета: ", a, " см<br>");
document.write("Длина второго катета: ", b, " см<br>");
document.write("Площадь треугольника: ", s.toFixed(3), " кв.см<br>");
</script>
</head>
<body>
</body>
</html>
