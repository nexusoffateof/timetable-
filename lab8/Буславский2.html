<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Изменение размеров</title>
<style>
img  {
   width: 150px;
   margin: 100px;
}
</style>
</head>
<body>
<img src="ris8/ris1.jpg" id="dd">

<script>
let mas=["150px","300px"];
let n = 0;
let len = mas.length;

function func() {
if (n>=len-1) n=0;
else n++;
dd.style.width = mas[n];
}
dd.addEventListener("click", func);
</script>
</body>
</html>
